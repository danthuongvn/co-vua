<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Cờ Vua Cùng Khủng Long</title>
<style>
  :root{
    --bg:#fff8e7; --ink:#3b2f2f; --light:#f3dcb4; --dark:#b5835a;
    --accent:#ff8a3d; --green:#3fae5a; --blue:#4a90e2; --red:#e8505b;
    --pf:'Segoe UI Symbol','DejaVu Sans','Noto Sans Symbols2',serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:"Nunito","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);
    min-height:100vh;display:flex;flex-direction:column;align-items:center}
  header{width:100%;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;
    background:#ffd36b;box-shadow:0 2px 0 #e9b949}
  header h1{font-size:1.2rem;margin:0}
  .iconbtn{border:none;background:#fff;border-radius:12px;font-size:1.4rem;width:46px;height:46px;cursor:pointer;
    box-shadow:0 3px 0 #d9a93a}
  main{width:100%;max-width:560px;padding:12px;display:flex;flex-direction:column;gap:12px}
  .guide{display:flex;gap:10px;align-items:flex-start}
  .owl{font-size:3.2rem;line-height:1;flex:none;animation:bob 2.4s ease-in-out infinite}
  .owl.happy{animation:jump .5s ease 2}
  @keyframes bob{50%{transform:translateY(-4px)}}
  @keyframes jump{50%{transform:translateY(-14px) rotate(-8deg)}}
  .bubble{background:#fff;border-radius:16px;padding:10px 14px;font-size:1.08rem;line-height:1.4;position:relative;
    box-shadow:0 3px 0 #e6d3b0;min-height:56px;flex:1}
  .bubble:before{content:"";position:absolute;left:-10px;top:18px;border:10px solid transparent;border-right-color:#fff;border-left:0}
  .board{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);width:100%;aspect-ratio:1;border-radius:10px;overflow:hidden;
    border:6px solid #7a5230;user-select:none;touch-action:manipulation}
  .sq{position:relative;min-width:0;min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .sq.l{background:var(--light)} .sq.d{background:var(--dark)}
  .sq.last{box-shadow:inset 0 0 0 100px rgba(255,214,60,.45)}
  .sq.sel{box-shadow:inset 0 0 0 100px rgba(74,144,226,.55)}
  .sq.hint{box-shadow:inset 0 0 0 5px #9b59ff, inset 0 0 0 100px rgba(155,89,255,.25)}
  .sq.bad{box-shadow:inset 0 0 0 5px var(--red), inset 0 0 0 100px rgba(232,80,91,.25)}
  .sq.good{box-shadow:inset 0 0 0 5px var(--green), inset 0 0 0 100px rgba(63,174,90,.3)}
  .sq.check{background:radial-gradient(circle,#ff4d4d 0%,#ff4d4d55 55%,transparent 75%)}
  .sq .coord{position:absolute;font-size:.6rem;opacity:.6;left:3px;bottom:1px}
  .piece{font-family:var(--pf);font-size:min(10vw,52px);line-height:1;pointer-events:none;transition:transform .15s}
  .piece.w{color:#fff;text-shadow:0 0 2px #000,0 0 2px #000,0 2px 2px #0006}
  .piece.b{color:#222;text-shadow:0 1px 1px #fff8}
  .sq.sel .piece{transform:scale(1.15)}
  .dot{position:absolute;width:30%;height:30%;border-radius:50%;background:rgba(63,174,90,.75);pointer-events:none}
  .ring{position:absolute;inset:6%;border-radius:50%;border:5px solid rgba(232,80,91,.8);pointer-events:none}
  .star{font-size:min(8vw,40px);pointer-events:none;animation:twinkle 1.2s ease-in-out infinite}
  @keyframes twinkle{50%{transform:scale(1.15)}}
  .controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .btn{border:none;border-radius:14px;padding:12px 16px;font-size:1.05rem;font-weight:700;cursor:pointer;color:#fff;
    background:var(--blue);box-shadow:0 4px 0 #2f6fb8;font-family:inherit}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 #2f6fb8}
  .btn.orange{background:var(--accent);box-shadow:0 4px 0 #d96a22}
  .btn.green{background:var(--green);box-shadow:0 4px 0 #2b8442}
  .btn.purple{background:#9b59ff;box-shadow:0 4px 0 #7337d6}
  .btn.red{background:var(--red);box-shadow:0 4px 0 #b83640}
  .btn:disabled{opacity:.5}
  .captured{font-family:var(--pf);min-height:28px;font-size:1.4rem;letter-spacing:2px}
  .menu{display:grid;gap:12px;margin-top:4px}
  .menu .btn{font-size:1.25rem;padding:18px;text-align:left;display:flex;align-items:center;gap:14px}
  .menu .btn span{font-size:1.9rem}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .card{background:#fff;border-radius:16px;padding:12px 8px;text-align:center;cursor:pointer;box-shadow:0 4px 0 #e6d3b0;border:none;font-family:inherit;color:inherit}
  .card .g{font-size:2.4rem;font-family:var(--pf)}
  .card .n{font-weight:800;font-size:1.02rem}
  .card .s{font-size:.95rem;min-height:1.2em;opacity:.85}
  .plist{display:grid;gap:10px}
  .plist .card{display:flex;align-items:center;gap:12px;text-align:left;padding:14px}
  .plist .card .g{font-family:inherit;font-size:2rem}
  .bar{height:10px;background:#eee;border-radius:6px;overflow:hidden;margin-top:6px}
  .bar i{display:block;height:100%;background:var(--green)}
  .stats{text-align:center;font-size:1.02rem;line-height:1.6}
  .hidden{display:none!important}
  .confetti{position:fixed;top:-40px;font-size:2rem;pointer-events:none;animation:fall 2.2s linear forwards;z-index:9}
  @keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
  .levelrow{display:flex;gap:6px;justify-content:center;align-items:center;font-weight:700;flex-wrap:wrap}
  .levelrow button{border:none;border-radius:10px;padding:8px 10px;font-family:inherit;font-weight:700;cursor:pointer;background:#fff;box-shadow:0 3px 0 #e6d3b0;font-size:.92rem}
  .levelrow button.on{background:var(--green);color:#fff;box-shadow:0 3px 0 #2b8442}
  .think{background:#fff3c4;border-radius:12px;padding:8px 12px;text-align:center;font-weight:700;font-size:.98rem}
  .toggle{display:flex;align-items:center;justify-content:center;gap:8px;font-size:.95rem}
  .review{display:grid;gap:6px;max-height:280px;overflow:auto;background:#fff;border-radius:14px;padding:8px;box-shadow:0 3px 0 #e6d3b0}
  .rv{display:flex;gap:8px;align-items:center;padding:8px;border-radius:10px;cursor:pointer;border:none;background:#faf5ea;font-family:inherit;font-size:1rem;text-align:left;color:inherit}
  .rv.on{outline:3px solid var(--blue)}
  .rv b{min-width:2.2em}
  .summary{display:flex;justify-content:space-around;background:#fff;border-radius:14px;padding:10px;box-shadow:0 3px 0 #e6d3b0;font-weight:700;text-align:center}
  .summary div span{display:block;font-size:1.5rem}
  header .right{display:flex;gap:8px}
  .players{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .pcard{position:relative;background:#fff;border-radius:18px;padding:16px 8px;text-align:center;cursor:pointer;box-shadow:0 4px 0 #e6d3b0;border:none;font-family:inherit;color:inherit}
  .pcard.last{outline:3px solid var(--green)}
  .pcard .av{font-size:3rem;line-height:1.1}
  .pcard .nm{font-weight:800;font-size:1.15rem;margin-top:4px}
  .pcard .st{font-size:.85rem;opacity:.75;margin-top:2px}
  .pcard .del{position:absolute;top:6px;right:6px;border:none;background:#f3e6cc;border-radius:50%;width:30px;height:30px;font-size:.9rem;cursor:pointer}
  .pcard.add{border:3px dashed #e0c89a;box-shadow:none;background:transparent}
  .form{background:#fff;border-radius:18px;padding:16px;box-shadow:0 4px 0 #e6d3b0;display:grid;gap:12px}
  .form input{font:inherit;font-size:1.15rem;padding:12px;border-radius:12px;border:2px solid #e6d3b0;width:100%}
  .avs{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
  .avs button{font-size:1.9rem;border:none;background:#faf5ea;border-radius:12px;padding:6px 0;cursor:pointer}
  .avs button.on{outline:3px solid var(--green);background:#e6f6ea}
  .sectitle{font-weight:800;font-size:1.1rem;margin:6px 2px 0}
</style>
</head>
<body>
<header>
  <button class="iconbtn" id="homeBtn" aria-label="Về trang chủ">🏠</button>
  <h1 id="title">♞ Cờ Vua</h1>
  <div class="right"><button class="iconbtn" id="playerBtn" aria-label="Đổi người chơi">👤</button>
  <button class="iconbtn" id="voiceBtn" aria-label="Bật tắt giọng đọc">🔊</button></div>
</header>

<main>
  <div class="guide">
    <div class="owl" id="owl">🦖</div>
    <div class="bubble" id="bubble">Chào con!</div>
  </div>

  <!-- Chọn người chơi -->
  <section id="playerPick" class="hidden"><div class="players" id="players"></div></section>
  <section id="playerForm" class="hidden">
    <div class="form">
      <label for="pname"><b>Tên người chơi</b></label>
      <input id="pname" maxlength="20" placeholder="Ví dụ: Nhật Minh" autocomplete="off">
      <b>Chọn hình đại diện</b>
      <div class="avs" id="avs"></div>
      <div class="controls"><button class="btn green" id="pSave">✅ Lưu</button><button class="btn orange" id="pCancel">Thôi</button></div>
    </div>
  </section>

  <section id="delForm" class="hidden">
    <div class="form">
      <div style="text-align:center"><div style="font-size:3rem" id="delAv"></div><b id="delName"></b></div>
      <div>Xóa người chơi sẽ mất hết sao và tiến độ. Người lớn hãy giải phép tính để xác nhận:</div>
      <div style="text-align:center;font-size:1.8rem;font-weight:800" id="delQ"></div>
      <input id="delAns" type="text" inputmode="numeric" pattern="-?[0-9]*" placeholder="Kết quả" autocomplete="off">
      <div class="controls"><button class="btn red" id="delOk">🗑️ Xóa</button><button class="btn green" id="delCancel">Thôi, không xóa</button></div>
    </div>
  </section>

  <!-- Trang chủ -->
  <section id="home" class="menu">
    <button class="btn purple" data-go="daily"><span>🗓️</span> Câu đố hôm nay</button>
    <button class="btn green" data-go="bot"><span>🤖</span> Chơi với máy</button>
    <button class="btn orange" data-go="puzzles"><span>🧩</span> Luyện câu đố</button>
    <button class="btn" data-go="learn"><span>📚</span> Học từng quân cờ</button>
    <button class="btn" data-go="two"><span>👫</span> Hai người chơi</button>
    <div class="stats" id="stats"></div>
  </section>

  <!-- Danh sách bài học -->
  <section id="lessonList" class="hidden"><div class="grid3" id="lessons"></div></section>

  <!-- Danh sách câu đố -->
  <section id="puzzleList" class="hidden"><div class="plist" id="plist"></div></section>

  <!-- Bàn cờ -->
  <section id="boardWrap" class="hidden" style="display:flex;flex-direction:column;gap:8px">
    <div class="levelrow" id="levelRow"></div>
    <div class="toggle" id="coachRow"><label><input type="checkbox" id="coachChk" checked> Khủng Long nhắc khi quân bị dọa</label></div>
    <div class="captured" id="capTop"></div>
    <div class="board" id="board"></div>
    <div class="captured" id="capBottom"></div>
    <div class="think" id="thinkBox">🛑 Trước khi đi, tự hỏi: Chiếu được không? Ăn được gì không? Máy đang dọa gì?</div>
    <div class="controls" id="playControls">
      <button class="btn purple" id="hintBtn">💡 Gợi ý</button>
      <button class="btn orange" id="undoBtn">↩️ Đi lại</button>
      <button class="btn green" id="newBtn">🔄 Ván mới</button>
      <button class="btn red hidden" id="reviewBtn">📊 Xem lại ván</button>
    </div>
    <div class="controls hidden" id="learnControls">
      <button class="btn orange" id="retryBtn">🔄 Làm lại</button>
      <button class="btn" id="backLessons">📚 Các bài học</button>
    </div>
    <div class="controls hidden" id="puzzleControls">
      <button class="btn purple" id="pHintBtn">💡 Gợi ý</button>
      <button class="btn orange" id="pRetryBtn">🔄 Làm lại</button>
      <button class="btn green" id="pNextBtn">➡️ Câu tiếp</button>
    </div>
    <div id="reviewPane" class="hidden" style="display:grid;gap:8px">
      <div class="summary" id="summary"></div>
      <div class="controls">
        <button class="btn orange" id="rvPrev">⬅️ Lỗi trước</button>
        <button class="btn orange" id="rvNext">Lỗi tiếp ➡️</button>
        <button class="btn green" id="rvDone">🔄 Ván mới</button>
      </div>
      <div class="review" id="reviewList"></div>
    </div>
  </section>
</main>

                const symbol = color === WHITE ? piece.toUpperCase() : piece.toLowerCase();
                s += ' ' + symbol + ' ';
            }
            else {
                s += ' . ';
            }
            if ((i + 1) & 0x88) {
                s += '|\n';
                i += 8;
            }
        }
        s += '   +------------------------+\n';
        s += '     a  b  c  d  e  f  g  h';
        return s;
    }
    perft(depth) {
        const moves = this._moves({ legal: false });
        let nodes = 0;
        const color = this._turn;
        for (let i = 0, len = moves.length; i < len; i++) {
            this._makeMove(moves[i]);
            if (!this._isKingAttacked(color)) {
                if (depth - 1 > 0) {
                    nodes += this.perft(depth - 1);
                }
                else {
                    nodes++;
                }
            }
            this._undoMove();
        }
        return nodes;
    }
    setTurn(color) {
        if (this._turn == color) {
            return false;
        }
        this.move('--');
        return true;
    }
    turn() {
        return this._turn;
    }
    board() {
        const output = [];
        let row = [];
        for (let i = Ox88.a8; i <= Ox88.h1; i++) {
            if (this._board[i] == null) {
                row.push(null);
            }
            else {
                row.push({
                    square: algebraic(i),
                    type: this._board[i].type,
                    color: this._board[i].color,
                });
            }
            if ((i + 1) & 0x88) {
                output.push(row);
                row = [];
                i += 8;
            }
        }
        return output;
    }
    squareColor(square) {
        if (square in Ox88) {
            const sq = Ox88[square];
            return (rank(sq) + file(sq)) % 2 === 0 ? 'light' : 'dark';
        }
        return null;
    }
    history({ verbose = false } = {}) {
        const reversedHistory = [];
        const moveHistory = [];
        while (this._history.length > 0) {
            reversedHistory.push(this._undoMove());
        }
        while (true) {
            const move = reversedHistory.pop();
            if (!move) {
                break;
            }
            if (verbose) {
                moveHistory.push(new Move(this, move));
            }
            else {
                moveHistory.push(this._moveToSan(move, this._moves()));
            }
            this._makeMove(move);
        }
        return moveHistory;
    }
    /*
     * Keeps track of position occurrence counts for the purpose of repetition
     * checking. Old positions are removed from the map if their counts are reduced to 0.
     */
    _getPositionCount(hash) {
        return this._positionCount.get(hash) ?? 0;
    }
    _incPositionCount() {
        this._positionCount.set(this._hash, (this._positionCount.get(this._hash) ?? 0) + 1);
    }
    _decPositionCount(hash) {
        const currentCount = this._positionCount.get(hash) ?? 0;
        if (currentCount === 1) {
            this._positionCount.delete(hash);
        }
        else {
            this._positionCount.set(hash, currentCount - 1);
        }
    }
    _pruneComments() {
        const reversedHistory = [];
        const currentComments = {};
        const copyComment = (fen) => {
            if (fen in this._comments) {
                currentComments[fen] = this._comments[fen];
            }
        };
        while (this._history.length > 0) {
            reversedHistory.push(this._undoMove());
        }
        copyComment(this.fen());
        while (true) {
            const move = reversedHistory.pop();
            if (!move) {
                break;
            }
            this._makeMove(move);
            copyComment(this.fen());
        }
        this._comments = currentComments;
    }
    getComment() {
        return this._comments[this.fen()];
    }
    setComment(comment) {
        this._comments[this.fen()] = comment.replace('{', '[').replace('}', ']');
    }
    /**
     * @deprecated Renamed to `removeComment` for consistency
     */
    deleteComment() {
        return this.removeComment();
    }
    removeComment() {
        const comment = this._comments[this.fen()];
        delete this._comments[this.fen()];
        return comment;
    }
    getComments() {
        this._pruneComments();
        return Object.keys(this._comments).map((fen) => {
            return { fen: fen, comment: this._comments[fen] };
        });
    }
    /**
     * @deprecated Renamed to `removeComments` for consistency
     */
    deleteComments() {
        return this.removeComments();
    }
    removeComments() {
        this._pruneComments();
        return Object.keys(this._comments).map((fen) => {
            const comment = this._comments[fen];
            delete this._comments[fen];
            return { fen: fen, comment: comment };
        });
    }
    setCastlingRights(color, rights) {
        for (const side of [KING, QUEEN]) {
            if (rights[side] !== undefined) {
                if (rights[side]) {
                    this._castling[color] |= SIDES[side];
                }
                else {
                    this._castling[color] &= ~SIDES[side];
                }
            }
        }
        this._updateCastlingRights();
        const result = this.getCastlingRights(color);
        return ((rights[KING] === undefined || rights[KING] === result[KING]) &&
            (rights[QUEEN] === undefined || rights[QUEEN] === result[QUEEN]));
    }
    getCastlingRights(color) {
        return {
            [KING]: (this._castling[color] & SIDES[KING]) !== 0,
            [QUEEN]: (this._castling[color] & SIDES[QUEEN]) !== 0,
        };
    }
    moveNumber() {
        return this._moveNumber;
    }
}

// ====== Stockfish (chạy trong Web Worker) ======
const Engine={
  w:null,failed:false,q:Promise.resolve(),waiter:null,lines:[],
  init(){
    if(this.w||this.failed)return;
    try{this.w=new Worker('engine/stockfish-19-lite-single.js');
      this.w.onmessage=e=>{const l=typeof e.data==='string'?e.data:'';
        if(this.waiter&&this.waiter.re.test(l)){const w=this.waiter;this.waiter=null;const out=this.lines;this.lines=[];out.push(l);w.res(out)}
        else this.lines.push(l)};
      this.w.onerror=()=>{this.failed=true;if(this.waiter){const w=this.waiter;this.waiter=null;w.rej('engine error')}};
      this.w.postMessage('uci');
    }catch(e){this.failed=true}
  },
  run(cmds,re,ms=20000){
    this.init();
    if(this.failed||!this.w)return Promise.reject('no engine');
    const p=this.q.then(()=>new Promise((res,rej)=>{
      this.lines=[];this.waiter={re,res,rej};cmds.forEach(c=>this.w.postMessage(c));
      setTimeout(()=>{if(this.waiter&&this.waiter.res===res){this.waiter=null;this.w.postMessage('stop');rej('timeout')}},ms);
    }));
    this.q=p.catch(()=>{});return p;
  },
  async analyse(fen,{depth=10,skill=20,multipv=1}={}){
    const out=await this.run(['setoption name Skill Level value '+skill,'setoption name MultiPV value '+multipv,'position fen '+fen,'go depth '+depth],/^bestmove/);
    let score=null,pv=[];
    for(const l of out){const m=l.match(/score (cp|mate) (-?\d+).*? pv (.+)$/);if(m&&/multipv 1 /.test(l+' ')||m&&!/multipv/.test(l)){score={[m[1]]:+m[2]};pv=m[3].split(' ')}}
    const bm=(out[out.length-1].match(/^bestmove (\S+)/)||[])[1];
    return {best:bm&&bm!=='(none)'?bm:null,score,pv};
  }
};

// ====== Mối đe dọa (dùng cho lời nhắc) ======
function threats(g){
  const best={};
  for(const m of g.moves({verbose:true})){
    if(!m.captured)continue;
    g.move(m);const recap=g.moves({verbose:true}).some(x=>x.to===m.to);g.undo();
    const gain=VAL[m.captured]-(recap?VAL[m.piece]:0);
    if(gain>0&&(!best[m.to]||best[m.to].gain<gain))best[m.to]={sq:m.to,gain};
  }
  return Object.values(best).sort((a,b)=>b.gain-a.gain);
}

  if(g.inCheck())return null;

function renderGame(){
  const marks={};
  if(lastMove){marks[lastMove.from]='last';marks[lastMove.to]='last'}
  if(hint){marks[hint.from]='hint';marks[hint.to]='hint'}
  drawBoard(boardCells(game,{selected,marks}));

const sideName=c=>mode==='bot'?(c==='w'?'con':'máy'):(c==='w'?'bên Trắng':'bên Đen');
function gameClick(sq){

function doMove(mv){
  const res=game.move({from:mv.from,to:mv.to,promotion:'q'});
  selected=null;hint=null;lastMove=res;
  res.captured?sfx.capture():sfx.move();
  renderGame();
  if(endCheck())return;
  if(mode==='bot'){
    let msg=praise(res);
    const danger=progress.coach?threats(game):[];
    if(danger.length){const d=danger[0];msg+=` Ôi, quân ${NAMES[game.get(d.sq).type]} của con ở ${d.sq} có thể bị ăn mất. Con có thể bấm Đi lại.`}
    say(msg.trim()||'Máy đang suy nghĩ...',{voice:!!msg.trim()});
    busy=true;setTimeout(botTurn,danger.length?1500:500);
  }else say((praise(res)+' Đến lượt '+sideName(game.turn())+'.').trim());
}
function praise(m){
  let s='';
  if(m.flags.includes('k')||m.flags.includes('q'))s+='Nhập thành rồi! Vua an toàn hơn. ';
  if(m.captured)s+=['Giỏi lắm!','Tuyệt vời!','Hay quá!'][Math.floor(Math.random()*3)]+` Ăn được quân ${NAMES[m.captured]} rồi. `;
  if(m.promotion)s+='Tốt đi đến hàng cuối và biến thành Hậu! ';
  if(m.san.includes('+'))s+='Chiếu! ';
  return s;
}
function scoreMove(m,noise){
  game.move(m);
  let s=0;
  if(game.isCheckmate())s+=1000;else if(game.isDraw())s-=40;
  if(m.captured)s+=VAL[m.captured]*10;
  if(m.promotion)s+=80;
  if(m.san.includes('+'))s+=3;
  const t=threats(game);if(t.length)s-=t[0].gain*9;
  game.undo();
  if('de'.includes(m.to[0])&&'45'.includes(m.to[1]))s+=2;
  if((m.piece==='n'||m.piece==='b')&&(m.from[1]==='1'||m.from[1]==='8'))s+=2;
  if(m.piece==='k'&&!m.flags.includes('k')&&!m.flags.includes('q'))s-=3;
  return s+Math.random()*noise;
}
function ownBotMove(lv){
  const moves=game.moves({verbose:true});
  if(Math.random()<lv.random)return moves[Math.floor(Math.random()*moves.length)];
  let pick,bs=-1e9;for(const m of moves){const s=scoreMove(m,lv.noise);if(s>bs){bs=s;pick=m}}
  return pick;
}
async function botTurn(){

  if(game.inCheck())msg+=' Vua của con đang bị chiếu! Chạy Vua, chặn lại, hoặc ăn quân đang chiếu.';

function endCheck(){
  if(!game.isGameOver())return false;
  progress.games++;
  if(game.isCheckmate()){
    const loser=game.turn();
    if(mode==='bot'&&loser==='b'){
      progress.wins++;progress.levelWins[startedLevel]=(progress.levelWins[startedLevel]||0)+1;
      const next=startedLevel<LEVELS.length-1&&progress.levelWins[startedLevel]>=2?` Con đã thắng mức này ${progress.levelWins[startedLevel]} lần, thử mức ${LEVELS[startedLevel+1].name.split(' ')[1]} xem!`:'';
      say(`Chiếu hết! ${fullName()} thắng rồi!`+next+' Bấm Xem lại ván để xem con đã đi hay ở đâu.',{happy:true});confetti();sfx.win();
    }else if(mode==='bot')say('Máy chiếu hết rồi. Không sao đâu con! Bấm Xem lại ván để tìm xem mình sai ở đâu nhé.');
    else{say(`Chiếu hết! ${loser==='w'?'Bên Đen':'Bên Trắng'} thắng rồi!`,{happy:true});confetti();sfx.win()}
  }else if(game.isStalemate())say('Hết nước đi mà Vua không bị chiếu, nên ván này hòa. Lần sau khi đang thắng, nhớ chừa đường cho Vua bên kia nhé!');
  else say('Ván cờ hòa rồi!');
  save();renderGame();
  if(mode==='bot')$('reviewBtn').classList.remove('hidden');
  return true;
}

$('hintBtn').onclick=async()=>{

let RV=null;
$('reviewBtn').onclick=reviewGame;
async function reviewGame(){
  const hist=game.history({verbose:true});
  if(hist.length<2)return;
  show('review');
  $('summary').innerHTML='';$('reviewList').innerHTML='';
  const g=new Chess(), fens=[g.fen()];
  for(const m of hist){g.move(m);fens.push(g.fen())}
  const evals=new Array(fens.length);
  for(let i=0;i<fens.length;i++){
    say(`Khủng Long đang xem lại ván cờ... ${Math.round(i/fens.length*100)}%`,{voice:false});
    const gg=new Chess(fens[i]);
    if(gg.isCheckmate()){evals[i]={best:null,cp:-1000};continue}
    if(gg.isDraw()){evals[i]={best:null,cp:0};continue}
    try{const a=await Engine.analyse(fens[i],{depth:10});evals[i]={best:a.best,cp:cpOf(a.score),mate:a.score&&a.score.mate}}
    catch(e){say('Máy phân tích chưa chạy được trên thiết bị này. Con thử lại sau nhé.');return}
  }
  const items=[];
  for(let i=0;i<hist.length;i++){
    const m=hist[i];if(m.color!=='w')continue;
    const before=evals[i].cp, after=-evals[i+1].cp; // góc nhìn bên Trắng
    const loss=Math.max(0,before-after);
    const played=m.from+m.to+(m.promotion||'');
    const isBest=evals[i].best&&evals[i].best.slice(0,4)===played.slice(0,4);
    let cat;
    if(evals[i].mate>0&&!(evals[i+1].mate<0||new Chess(fens[i+1]).isCheckmate()))cat='miss';
    else if(isBest||loss<=25)cat='great';
    else if(loss<=90)cat='good';
    else if(loss<=220)cat='inacc';
    else cat='blunder';
    items.push({i,m,cat,best:evals[i].best,loss,before,after});
  }
  const CAT={great:['✨','Tuyệt vời'],good:['👍','Tốt'],inacc:['🤔','Chưa chuẩn'],blunder:['❗','Sai lầm'],miss:['🎯','Bỏ lỡ chiếu hết']};
  const cnt=k=>items.filter(x=>x.cat===k).length;
  $('summary').innerHTML=['great','good','inacc','blunder'].map(k=>`<div><span>${CAT[k][0]} ${cnt(k)+(k==='blunder'?cnt('miss'):0)}</span>${CAT[k][1]}</div>`).join('');
  $('reviewList').innerHTML=items.map((x,j)=>`<button class="rv" data-j="${j}"><b>${Math.floor(x.i/2)+1}.</b> ${CAT[x.cat][0]} ${NAMES[x.m.piece]} ${x.m.from}→${x.m.to} <span style="margin-left:auto;opacity:.75">${CAT[x.cat][1]}</span></button>`).join('');
  RV={items,fens,CAT,cur:-1};
  $('reviewList').querySelectorAll('.rv').forEach(b=>b.onclick=()=>showReview(+b.dataset.j));
  const mistakes=items.filter(x=>x.cat==='blunder'||x.cat==='miss'||x.cat==='inacc');
  const goodPct=Math.round((cnt('great')+cnt('good'))/Math.max(1,items.length)*100);
  say(`Xong rồi! ${goodPct}% nước đi của con là nước tốt. `+(mistakes.length?`Có ${mistakes.length} chỗ con có thể đi hay hơn. Bấm Lỗi tiếp để xem từng chỗ nhé.`:'Con chơi rất chắc chắn!'),{happy:goodPct>=70});
  drawBoard(boardCells(new Chess(fens[fens.length-1])));
}
function showReview(j){
  if(!RV||!RV.items[j])return;
  RV.cur=j;const x=RV.items[j];
  $('reviewList').querySelectorAll('.rv').forEach(b=>b.classList.toggle('on',+b.dataset.j===j));
  const g=new Chess(RV.fens[x.i]);const marks={};
  const bestU=x.best;
  marks[x.m.from]='bad';marks[x.m.to]='bad';
  if(bestU&&x.cat!=='great'){marks[bestU.slice(0,2)]='good';marks[bestU.slice(2,4)]='good'}
  if(x.cat==='great'){marks[x.m.from]='good';marks[x.m.to]='good'}
  drawBoard(boardCells(g,{marks}));
  const n=Math.floor(x.i/2)+1;
  let t=`Nước ${n}: con đi ${NAMES[x.m.piece]} ${x.m.from} đến ${x.m.to}. `;
  if(x.cat==='great')t+='Đây là nước rất hay!';
  else if(x.cat==='good')t+='Nước này ổn. '+(bestU?`Khủng Long thích ${describe(g,bestU)} hơn một chút.`:'');
  else if(x.cat==='miss')t+=`Ở đây con có thể chiếu hết! Nước ô xanh là ${describe(g,bestU)}.`;
  else{
    const g2=new Chess(RV.fens[x.i+1]);const t2=threats(g2);
    t+=(x.cat==='blunder'?'Đây là sai lầm. ':'Nước này chưa chuẩn. ')+
      (t2.length?`Sau nước này, quân ${NAMES[g2.get(t2[0].sq).type]} ở ${t2[0].sq} bị bỏ trống. `:'')+
      (bestU?`Nước tốt hơn là ${describe(g,bestU)} (ô xanh).`:'');
  }
  say(t);
}
function jumpMistake(dir){
  if(!RV)return;
  const bad=RV.items.map((x,j)=>['blunder','miss','inacc'].includes(x.cat)?j:-1).filter(j=>j>=0);
  if(!bad.length){say('Không có lỗi nào đáng kể. Giỏi quá!');return}
  let k=dir>0?bad.find(j=>j>RV.cur):[...bad].reverse().find(j=>j<RV.cur);
  if(k===undefined)k=dir>0?bad[0]:bad[bad.length-1];
  showReview(k);
  const el=$('reviewList').querySelector(`[data-j="${k}"]`);if(el)el.scrollIntoView({block:'nearest'});
}

let P=null; // {list,idx,g,step,sol,hints,failed,daily}
function todayKey(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function hashStr(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function dailySet(){
  const h=hashStr(todayKey());
  const pick=(theme,n,off)=>{const pool=PUZ.filter(p=>theme.includes(p.theme));const out=[];for(let i=0;i<n&&pool.length;i++)out.push(pool[(h+off+i*7919)%pool.length]);return out};
  return [...pick(['mate1'],2,0),...pick(['capture','fork'],2,13),...pick(['mate2'],1,29)];
}
function startDaily(){
  if(!PUZ.length){say('Chưa có câu đố.');return}
  const list=dailySet();const done=progress.daily[todayKey()]||[];
  const idx=list.findIndex(p=>!done.includes(p.id));
  startPuzzle(list,idx<0?0:idx,true);
}
function openPuzzleList(){

function startPuzzle(list,idx,daily){

function renderPuzzle(extra={}){

function puzzleMove(mv){
  const g=P.g,p=P.p,sol=p.sol;
  const u=mv.from+mv.to;
  const res=g.move({from:mv.from,to:mv.to,promotion:'q'});P.sel=null;P.last=res;
  let ok;
  const isFinal=(p.theme==='mate2'?P.step===2:true);
  if(p.theme==='mate1'||(p.theme==='mate2'&&P.step===2))ok=g.isCheckmate();
  else ok=u===sol[P.step].slice(0,4);
  if(!ok){
    P.failed=true;sfx.bad();renderPuzzle({[mv.to]:'bad'});
    say(['Chưa đúng rồi. ','Gần rồi, nhưng chưa phải. ','Thử lại nào! '][Math.floor(Math.random()*3)]+'Con nhìn xem có chiếu được không, có ăn được gì không?');
    P.busy=true;setTimeout(()=>{g.undo();P.last=null;P.busy=false;renderPuzzle()},1100);return;
  }
  res.captured?sfx.capture():sfx.move();
  if(p.theme==='mate2'&&P.step===0){
    renderPuzzle({[mv.to]:'good'});P.busy=true;say('Đúng rồi! Giờ xem máy đỡ thế nào...',{voice:true});
    setTimeout(()=>{const r=g.move(uciMove(sol[1]));P.last=r;P.step=2;P.busy=false;sfx.move();renderPuzzle();
      say(`Máy đi ${NAMES[r.piece]} đến ${r.to}. Giờ con chiếu hết đi!`)},1000);
    return;
  }
  // giải xong
  P.done=true;renderPuzzle({[mv.to]:'good'});
  const stars=P.failed?1:P.hints?2:3;
  progress.solved[p.id]=Math.max(progress.solved[p.id]||0,stars);
  if(P.daily){const k=todayKey();progress.daily[k]=progress.daily[k]||[];if(!progress.daily[k].includes(p.id))progress.daily[k].push(p.id)}
  save();sfx.win();
  let msg=(stars===3?`Xuất sắc, ${shortName()}! Đúng ngay lần đầu! ⭐⭐⭐`:stars===2?'Giỏi lắm! ⭐⭐':'Làm được rồi! ⭐')+' ';
  if(p.theme==='mate1'||p.theme==='mate2')msg+='Chiếu hết! Vua đối phương không còn đường chạy.';
  else if(p.theme==='fork')msg+=`Quân ${NAMES[res.piece]} tấn công 2 quân cùng lúc, đối phương chỉ cứu được một!`;
  else msg+=`Ăn được quân ${NAMES[res.captured||'p']} mà không bị mất gì.`;
  if(P.daily&&(progress.daily[todayKey()]||[]).length>=P.list.length){msg+=` ${shortName()} đã xong 5 câu đố hôm nay!`;confetti()}
  say(msg,{happy:true});
  // diễn tiếp phần còn lại cho câu thắng quân
  if(p.cont&&p.cont.length===2&&p.theme!=='mate1'&&p.theme!=='mate2'){
    setTimeout(()=>{try{const r1=g.move(uciMove(p.cont[0]));P.last=r1;renderPuzzle();
      setTimeout(()=>{try{const r2=g.move(uciMove(p.cont[1]));P.last=r2;sfx.capture();renderPuzzle({[r2.to]:'good'})}catch(e){}},900)}catch(e){}},1600);
  }
}

  if(P.daily){const done=progress.daily[todayKey()]||[];const nx=P.list.findIndex((p,i)=>i>P.idx&&!done.includes(p.id));
    if(nx<0&&done.length>=P.list.length){goHome();return}
    startPuzzle(P.list,nx<0?(P.idx+1)%P.list.length:nx,true);return}
  startPuzzle(P.list,(P.idx+1)%P.list.length,false);
};

// ====== Học từng quân ======
let L=null;
function openLessons(){
  show('lessonList');
  $('lessons').innerHTML=LESSONS.map((ls,i)=>`<button class="card" data-i="${i}"><div class="g">${GLYPH[ls.t]}</div><div class="n">${NAMES[ls.t]}</div><div class="s">${progress.lessons[ls.t]?'⭐⭐⭐':''}</div></button>`).join('');
  $('lessons').querySelectorAll('.card').forEach(b=>b.onclick=()=>startLesson(+b.dataset.i,0));
  say('Con chọn một quân cờ để ôn lại nhé. Dùng quân đó ăn hết các ngôi sao!');
}
function startLesson(i,round){
  const ls=LESSONS[i];
  L={idx:i,round,type:ls.t,pos:ls.start,stars:new Set(ls.rounds[round]),sel:false};
  show('lesson');renderLesson();
  say((round===0?HOW[ls.t]+' ':'Màn 2! ')+'Dùng quân '+NAMES[ls.t]+' ăn hết các ngôi sao nhé.');
}
function lessonMoves(type,sq){
  const f=FILES.indexOf(sq[0]),r=+sq[1],out=[];
  const add=(df,dr)=>{const nf=f+df,nr=r+dr;if(nf>=0&&nf<8&&nr>=1&&nr<=8)out.push(FILES[nf]+nr)};
  const slide=dirs=>dirs.forEach(([df,dr])=>{for(let k=1;k<8;k++)add(df*k,dr*k)});
  const st=[[1,0],[-1,0],[0,1],[0,-1]],dg=[[1,1],[1,-1],[-1,1],[-1,-1]];
  if(type==='r')slide(st);if(type==='b')slide(dg);if(type==='q')slide(st.concat(dg));
  if(type==='k')st.concat(dg).forEach(([a,b])=>add(a,b));
  if(type==='n')[[1,2],[2,1],[-1,2],[-2,1],[1,-2],[2,-1],[-1,-2],[-2,-1]].forEach(([a,b])=>add(a,b));
  if(type==='p'){add(0,1);if(r===2)add(0,2)}
  return out;
}
function renderLesson(){
  const tg=L.sel?lessonMoves(L.type,L.pos):[];
  drawBoard(sq=>({piece:sq===L.pos?{type:L.type,color:'w'}:null,star:L.stars.has(sq),target:tg.includes(sq),cls:sq===L.pos&&L.sel?'sel':''}));
}
function lessonClick(sq){
  if(!L)return;
  if(sq===L.pos){L.sel=!L.sel;renderLesson();return}
  if(!L.sel){say('Con chạm vào quân '+NAMES[L.type]+' trước nhé.');return}
  if(!lessonMoves(L.type,L.pos).includes(sq)){sfx.bad();say('Quân '+NAMES[L.type]+' không đi được đến đó. '+HOW[L.type]);return}
  L.pos=sq;L.sel=false;
  if(L.stars.delete(sq))sfx.star();else sfx.move();
  if(L.type==='p'&&sq[1]==='8'){L.type='q';say('Tốt đi đến hàng cuối đã biến thành Hậu! Đó gọi là phong cấp.',{happy:true})}
  renderLesson();
  if(L.stars.size===0){
    const ls=LESSONS[L.idx];
    if(L.round+1<ls.rounds.length){say('Giỏi quá! Sang màn tiếp theo nào!',{happy:true});sfx.win();setTimeout(()=>startLesson(L.idx,L.round+1),1800)}
    else{progress.lessons[ls.t]=true;save();confetti();sfx.win();say(`Tuyệt vời! ${shortName()} đã học xong quân ${NAMES[ls.t]}!`,{happy:true})}
  }else if(!(L.type==='q'&&LESSONS[L.idx].t==='p'))say(`Còn ${L.stars.size} ngôi sao nữa thôi!`,{voice:false});
}
$('retryBtn').onclick=()=>L&&startLesson(L.idx,0);
$('backLessons').onclick=openLessons;

// cho kiểm thử tự động
window.__app={get game(){return game},get P(){return P},get RV(){return RV},Engine,startGame,startPuzzle,PUZ,reviewGame,showReview};
// ====== Người chơi ======
const AVATARS=['🦁','🐯','🐼','🐰','🦊','🐸','🐵','🐧','🐶','🐱','🦄','🐻'];
function updateHeader(){const p=curPlayer();
  $('title').textContent=p?`♞ Cờ Vua của ${shortName()}`:'♞ Cờ Vua';$('playerBtn').textContent=p?p.avatar:'👤'}
function statsOf(id){const pr=Object.assign(blankProgress(),lsGet('covua-progress-'+id)||{});
  return `🧩 ${Object.keys(pr.solved).length} câu · 🏆 ${pr.wins} ván`}
function openPlayers(){
  show('players');updateHeader();
  const cards=players.list.map(p=>`<button class="pcard${p.id===players.current?' last':''}" data-id="${p.id}">
      <span class="del" data-del="${p.id}" role="button" aria-label="Xóa">✕</span>
      <div class="av">${p.avatar}</div><div class="nm"></div><div class="st">${statsOf(p.id)}</div></button>`).join('');
  $('players').innerHTML=cards+`<button class="pcard add" id="addPlayer"><div class="av">➕</div><div class="nm">Thêm người chơi</div></button>`;
  // tên do người dùng nhập: gán bằng textContent
  $('players').querySelectorAll('.pcard[data-id]').forEach(c=>{const p=players.list.find(x=>x.id===c.dataset.id);c.querySelector('.nm').textContent=p.name});
  $('players').querySelectorAll('.pcard[data-id]').forEach(c=>c.onclick=e=>{
    const del=e.target.closest('[data-del]');
    if(del){e.stopPropagation();openDelForm(del.dataset.del);return}
    choosePlayer(c.dataset.id)});
  $('addPlayer').onclick=()=>openPlayerForm();
  say(players.list.length?'Ai chơi cờ hôm nay? Bấm vào tên của mình nhé!':'Chào bạn! Mình là Khủng Long Xanh. Bấm Thêm người chơi để tạo tên của bạn nhé!');
}
function choosePlayer(id){
  players.current=id;lsSet('covua-players',players);loadProgress(id);updateHeader();sfx.star();goHome();
}
function removePlayer(id){
  players.list=players.list.filter(p=>p.id!==id);
  try{localStorage.removeItem('covua-progress-'+id)}catch(e){}
  if(players.current===id)players.current=null;
  lsSet('covua-players',players);
}
let pickedAv=AVATARS[0];
function openPlayerForm(){
  show('playerForm');
  const used=players.list.map(p=>p.avatar);pickedAv=AVATARS.find(a=>!used.includes(a))||AVATARS[0];
  const draw=()=>{$('avs').innerHTML=AVATARS.map(a=>`<button class="${a===pickedAv?'on':''}" data-a="${a}">${a}</button>`).join('');
    $('avs').querySelectorAll('button').forEach(b=>b.onclick=()=>{pickedAv=b.dataset.a;draw()})};
  draw();$('pname').value='';setTimeout(()=>$('pname').focus(),50);
  say('Bạn tên là gì? Gõ tên rồi chọn một con vật làm hình đại diện nhé.');
}
$('pSave').onclick=()=>{
  const name=$('pname').value.trim().replace(/\s+/g,' ');
  if(!name){say('Bạn nhớ gõ tên vào ô trên nhé.');$('pname').focus();return}
  if(players.list.some(p=>p.name.toLowerCase()===name.toLowerCase())){say('Tên này có rồi. Bạn chọn tên khác, hoặc quay lại bấm vào tên đó nhé.');return}
  const id='p'+Date.now();players.list.push({id,name,avatar:pickedAv});lsSet('covua-players',players);
  choosePlayer(id);
};
$('pname').addEventListener('keydown',e=>{if(e.key==='Enter')$('pSave').click()});
$('pCancel').onclick=()=>openPlayers();
$('playerBtn').onclick=()=>openPlayers();
// Xóa người chơi: phải giải đúng phép tính (để bé không lỡ tay xóa)
let delId=null,delAnswer=null;
function newQuestion(){
  const r=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
  const a=r(3,9),b=r(3,9),c=r(1,9);
  delAnswer=a*b-c;$('delQ').textContent=`${a} × ${b} − ${c} = ?`;$('delAns').value='';
}
function openDelForm(id){
  const p=players.list.find(x=>x.id===id);if(!p)return;
  delId=id;show('delForm');$('delAv').textContent=p.avatar;$('delName').textContent=p.name;newQuestion();
  setTimeout(()=>$('delAns').focus(),50);
  say(`Muốn xóa ${p.name} thì nhờ người lớn giải phép tính nhé.`,{voice:false});
}
$('delOk').onclick=()=>{
  const v=$('delAns').value.trim();
  if(v!==''&&+v===delAnswer){const p=players.list.find(x=>x.id===delId);removePlayer(delId);delId=null;openPlayers();
    say(`Đã xóa ${p?p.name:'người chơi'}.`,{voice:false})}
  else{sfx.bad();say('Chưa đúng. Thử phép tính mới nhé.',{voice:false});newQuestion();$('delAns').focus()}
};
$('delAns').addEventListener('keydown',e=>{if(e.key==='Enter')$('delOk').click()});
$('delCancel').onclick=()=>{delId=null;openPlayers()};
openPlayers();
}
